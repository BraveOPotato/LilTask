<!DOCTYPE html>
<html lang="en" data-theme="dark-violet">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0f0f11"/>
<meta name="description" content="Collaborative todo lists with real-time sync"/>
<link rel="manifest" id="manifest-link"/>
<title>LilTask — Collaborative Lists</title>

<!-- Yjs CRDT via ESM, exposed as window.Y -->
<script type="module">
  import * as Y from 'https://esm.sh/yjs@13.6.18';
  window.Y = Y;
  window._yjsReady = true;
  window.dispatchEvent(new Event('yjs-ready'));
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0f0f11;
  --bg2: #16161a;
  --bg3: #1e1e24;
  --bg4: #26262e;
  --border: #2e2e38;
  --text: #e8e8f0;
  --text2: #9090a8;
  --text3: #5a5a72;
  --accent: #7c6aff;
  --accent2: #a855f7;
  --accent-glow: rgba(124,106,255,0.18);
  --green: #22d3a0;
  --red: #ff5c7c;
  --yellow: #fbbf24;
  --radius: 10px;
  --font: 'Syne', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --sidebar: 240px;
  --header: 56px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
}

/* ─── Layout ─── */
#app { display: flex; height: 100vh; overflow: hidden; }

#sidebar {
  width: var(--sidebar);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.25s ease;
  z-index: 50;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

/* ─── Sidebar ─── */
.sidebar-logo {
  padding: 18px 16px 12px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}
.sidebar-logo span { color: var(--accent); }

.sidebar-section {
  padding: 10px 8px 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  font-family: var(--mono);
}

.list-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius);
  margin: 2px 6px;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 14px;
  font-weight: 500;
  color: var(--text2);
  position: relative;
}
.list-item:hover { background: var(--bg3); color: var(--text); }
.list-item.active { background: var(--accent-glow); color: var(--accent); }
.list-item .li-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  background: var(--bg4);
  color: var(--text3);
  padding: 1px 6px;
  border-radius: 99px;
}
.list-item.active .li-count { background: var(--accent); color: #fff; }
.list-item .li-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text3);
  flex-shrink: 0;
}
.list-item.active .li-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

.li-delete-btn {
  display: none;
  width: 18px; height: 18px;
  border-radius: 4px;
  border: none;
  background: none;
  color: var(--text3);
  font-size: 11px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
  padding: 0;
  line-height: 1;
}
.list-item:hover .li-delete-btn { display: flex; }
.li-delete-btn:hover { background: var(--red); color: #fff; }

#new-list-btn {
  margin: 6px 10px;
  padding: 8px 12px;
  background: none;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  color: var(--text3);
  font-family: var(--font);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  width: calc(100% - 20px);
}
#new-list-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

.sidebar-nav {
  margin-top: auto;
  border-top: 1px solid var(--border);
  padding: 8px;
}
.nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--text2);
  transition: all 0.15s;
  background: none;
  border: none;
  width: 100%;
  font-family: var(--font);
}
.nav-btn:hover, .nav-btn.active { background: var(--bg3); color: var(--text); }
.nav-btn.active { color: var(--accent); }

/* ─── Header ─── */
#header {
  height: var(--header);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
}
#header-title {
  font-size: 17px;
  font-weight: 700;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.header-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  background: none;
  color: var(--text2);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.header-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
.header-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.header-btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }

/* ─── Todo View ─── */
#todo-view {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
}

.todo-input-wrap {
  order: 1;
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}

.list-progress {
  order: 2;
}

#todos-container {
  order: 3;
  flex: 1;
}
#todo-input {
  flex: 1;
  background: var(--bg2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 16px;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s;
}
#todo-input:focus { border-color: var(--accent); }
#todo-input::placeholder { color: var(--text3); }
#add-btn {
  padding: 11px 20px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
#add-btn:hover { background: var(--accent2); }

/* ─── Todo Items ─── */
.todo-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius);
  margin-bottom: 4px;
  background: var(--bg2);
  border: 1px solid var(--border);
  transition: all 0.2s;
  animation: slideIn 0.2s ease;
  position: relative;
  group: true;
}
.todo-item:hover { border-color: var(--bg4); background: var(--bg3); }
.todo-item.done { opacity: 0.5; }
.todo-item.done .todo-text { text-decoration: line-through; color: var(--text3); }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.todo-check {
  width: 20px; height: 20px;
  border-radius: 6px;
  border: 2px solid var(--border);
  background: none;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  position: relative;
}
.todo-check:hover { border-color: var(--accent); background: var(--accent-glow); }
.todo-check.checked { background: var(--accent); border-color: var(--accent); }
.todo-check.checked::after {
  content: '';
  width: 5px; height: 9px;
  border: 2px solid #fff;
  border-top: none; border-left: none;
  transform: rotate(45deg) translateY(-1px);
}

.todo-text {
  flex: 1;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
  cursor: text;
  outline: none;
}
.todo-text:focus {
  background: var(--bg4);
  border-radius: 4px;
  padding: 0 4px;
}

.todo-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.15s;
  flex-shrink: 0;
}
.todo-item:hover .todo-actions { opacity: 1; }
.todo-act-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: none;
  background: var(--bg4);
  color: var(--text3);
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.todo-act-btn:hover { background: var(--red); color: #fff; }
.todo-act-btn.edit-btn:hover { background: var(--accent); color: #fff; }

/* Category group header */
.category-header {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text3);
  margin: 16px 0 8px;
  padding: 0 2px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.category-header::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ─── Calendar View ─── */
#calendar-view {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: none;
}
#calendar-view.active { display: block; }
#todo-view.active { display: block; }
#todo-view:not(.active) { display: none; }

.cal-grid-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 4px;
}
.cal-day-name {
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  padding: 4px 0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-cell {
  min-height: 80px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.cal-cell:hover { border-color: var(--accent); background: var(--bg3); }
.cal-cell.other-month { opacity: 0.35; }
.cal-cell.today { border-color: var(--accent); }
.cal-cell.today .cal-date { color: var(--accent); font-weight: 800; }
.cal-cell.has-todos::before {
  content: '';
  position: absolute;
  bottom: 6px; right: 6px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
}
.cal-date {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 4px;
}
.cal-todo-preview {
  font-size: 10px;
  color: var(--text3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}
.cal-todo-preview.done-prev { text-decoration: line-through; }

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.cal-nav-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 8px 14px;
  font-family: var(--font);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.cal-month-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

/* ─── Modals ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  width: 100%;
  max-width: 480px;
  max-height: 80vh;
  overflow-y: auto;
  animation: popIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.93) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 16px;
  letter-spacing: -0.3px;
}
.modal-input {
  width: 100%;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  outline: none;
  margin-bottom: 12px;
  transition: border-color 0.15s;
}
.modal-input:focus { border-color: var(--accent); }
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
}
.modal-btn {
  padding: 9px 18px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  background: none;
  color: var(--text2);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.modal-btn:hover { border-color: var(--border); color: var(--text); background: var(--bg4); }
.modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.modal-btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }

/* Plugin modal */
.plugin-card {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  margin-bottom: 10px;
  transition: border-color 0.15s;
}
.plugin-card.enabled { border-color: var(--accent); background: var(--accent-glow); }
.plugin-icon {
  font-size: 26px;
  flex-shrink: 0;
  line-height: 1;
}
.plugin-info { flex: 1; }
.plugin-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
.plugin-desc { font-size: 12px; color: var(--text3); line-height: 1.4; }
.plugin-toggle {
  flex-shrink: 0;
  width: 40px; height: 22px;
  border-radius: 99px;
  background: var(--bg4);
  border: none;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
}
.plugin-toggle.on { background: var(--accent); }
.plugin-toggle::after {
  content: '';
  position: absolute;
  left: 3px; top: 3px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}
.plugin-toggle.on::after { transform: translateX(18px); }

/* Share modal */
.share-link-box {
  display: flex;
  gap: 8px;
  align-items: center;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text2);
  overflow: hidden;
  word-break: break-all;
}
.share-copy-btn {
  flex-shrink: 0;
  padding: 6px 12px;
  border-radius: 6px;
  background: var(--accent);
  border: none;
  color: #fff;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

/* Sync status */
#sync-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
}
.sync-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text3);
  transition: background 0.3s;
}
.sync-dot.syncing { background: var(--yellow); animation: pulse 0.8s infinite; }
.sync-dot.synced { background: var(--green); }
.sync-dot.error { background: var(--red); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ─── Celebration ─── */
#celebration {
  position: fixed;
  inset: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
}
#celebration.active { opacity: 1; }
.celebrate-emoji {
  font-size: 80px;
  animation: celebBounce 0.6s cubic-bezier(0.34,1.56,0.64,1);
  filter: drop-shadow(0 0 30px rgba(124,106,255,0.6));
}
@keyframes celebBounce {
  from { transform: scale(0) rotate(-20deg); }
  to { transform: scale(1) rotate(0deg); }
}

/* ─── Empty states ─── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
}
.empty-state .es-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-state .es-title { font-size: 18px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
.empty-state .es-desc { font-size: 14px; }

/* Mobile sidebar toggle */
#menu-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
}

/* Progress bar for a list */
.list-progress {
  order: 2;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-bar {
  flex: 1;
  height: 4px;
  background: var(--bg4);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.4s ease;
}
.progress-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  white-space: nowrap;
}

/* Calendar date modal todos */
.cal-modal-todo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.cal-modal-todo:last-child { border-bottom: none; }


/* ─── Drag to reorder ─── */
.todo-item { cursor: default; user-select: none; }
.drag-handle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  color: var(--text3);
  cursor: grab;
  font-size: 14px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.15s;
  touch-action: none;
}
.todo-item:hover .drag-handle { opacity: 1; }
.todo-item.dragging {
  opacity: 0.4;
  background: var(--bg4);
  border-color: var(--accent);
}
.todo-item.drag-over {
  border-top: 2px solid var(--accent);
}

/* ─── Section headers ─── */
.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0 10px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--text3);
}
.section-header:first-child { margin-top: 0; }
.section-header::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.section-header .sh-count {
  background: var(--bg4);
  color: var(--text3);
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 99px;
}

/* Deadline badge */
.due-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 99px;
  background: rgba(124,106,255,0.15);
  color: var(--accent);
  white-space: nowrap;
  flex-shrink: 0;
}
.due-badge.overdue { background: rgba(255,92,124,0.15); color: var(--red); }

/* ─── Themes ─── */
/* Dark themes */
[data-theme="dark-violet"] {
  --bg:#0f0f11;--bg2:#16161a;--bg3:#1e1e24;--bg4:#26262e;
  --border:#2e2e38;--text:#e8e8f0;--text2:#9090a8;--text3:#5a5a72;
  --accent:#7c6aff;--accent2:#a855f7;--accent-glow:rgba(124,106,255,0.18);
  --green:#22d3a0;--red:#ff5c7c;--yellow:#fbbf24;
}
[data-theme="dark-slate"] {
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;

}

/* Mobile calendar dots */

  .cal-todo-preview { display: none; }
  .cal-dots {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .cal-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .cal-dot.done-dot { background: var(--text3); }
}

  .cal-dots { display: none; }
}

  inset: 0;

<!-- Modals rendered by JS -->

<script>
// ════════════════════════════════════════════════════════════
// CONFIG — point WORKER_URL at your deployed Cloudflare Worker
// ════════════════════════════════════════════════════════════
const WORKER_URL = 'https://liltask-sync.abdullahalkafajy.workers.dev/';
// If no worker deployed, app works offline-only (no sync indicator shown)

// ─── PWA Manifest (injected) ──────────────────────────────
const manifestData = {
  name: 'LilTask – Collaborative Lists',
  short_name: 'LilTask',
  start_url: '/',
  display: 'standalone',
  background_color: '#0f0f11',
  theme_color: '#0f0f11',
  icons: [{ src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>", sizes: '192x192', type: 'image/svg+xml' }]
};
const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

// ─── State ────────────────────────────────────────────────
let lists = {}; // { listId: { name, roomId } }
let activeListId = null;
let currentView = 'lists';
let calYear, calMonth;
let plugins = { categoryGroup: false, finishRewards: false };
let ydocs = {}; // { listId: Y.Doc }
let syncTimers = {};

const now = new Date();
calYear = now.getFullYear();
calMonth = now.getMonth();

// ─── Persistence ──────────────────────────────────────────
function save() {
  localStorage.setItem('liltask_lists', JSON.stringify(lists));
  localStorage.setItem('liltask_plugins', JSON.stringify(plugins));
  localStorage.setItem('liltask_active', activeListId);
}

function load() {
  try {
    lists = JSON.parse(localStorage.getItem('liltask_lists') || '{}');
    plugins = JSON.parse(localStorage.getItem('liltask_plugins') || '{"categoryGroup":false,"finishRewards":false}');
    activeListId = localStorage.getItem('liltask_active');
  } catch(e) {
    lists = {}; plugins = { categoryGroup: false, finishRewards: false };
  }
}

// ─── Room ID (URL-based collaboration) ───────────────────
function getRoomFromURL() {
  const hash = location.hash.slice(1);
  if (hash && hash.startsWith('room:')) {
    const rest = hash.slice(5); // roomId:encodedName  OR  roomId (legacy)
    const colonIdx = rest.indexOf(':');
    if (colonIdx !== -1) {
      return { roomId: rest.slice(0, colonIdx), name: decodeURIComponent(rest.slice(colonIdx + 1)) };
    }
    return { roomId: rest, name: 'Shared List' };
  }
  return null;
}

function generateId(len = 10) {
  return Math.random().toString(36).slice(2, 2 + len) +
         Math.random().toString(36).slice(2, 2 + Math.max(0, len - 10));
}

// ─── Yjs CRDT per list ───────────────────────────────────
function getOrCreateYDoc(listId) {
  if (ydocs[listId]) return ydocs[listId];
  if (!window.Y) { console.error("Yjs not loaded"); return null; }
  const doc = new Y.Doc();
  ydocs[listId] = doc;

  // Load persisted state
  const stored = localStorage.getItem('liltask_ydoc_' + listId);
  if (stored) {
    try {
      const arr = Uint8Array.from(JSON.parse(stored));
      Y.applyUpdate(doc, arr);
    } catch(e) {}
  }

  // Persist on change
  doc.on('update', (update) => {
    const state = Y.encodeStateAsUpdate(doc);
    localStorage.setItem('liltask_ydoc_' + listId, JSON.stringify(Array.from(state)));
    scheduleSync(listId);
    renderTodos();
    renderListsNav();
    updateProgress();
    if (currentView === 'calendar') renderCalendar();
  });

  return doc;
}

function getYTodos(listId) {
  const doc = getOrCreateYDoc(listId);
  return doc.getArray('todos');
}

// getYCalendar removed — calendar data lives in the main Y.Array (dueDate field)
function getTodosForDate(listId, dateKey) {
  return getYTodos(listId).toArray().filter(t => t.dueDate === dateKey);
}

// ─── Sync to/from Worker ──────────────────────────────────
function setSyncStatus(state) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if (!dot) return;
  dot.className = 'sync-dot ' + state;
  label.textContent = state === 'synced' ? 'synced' : state === 'syncing' ? 'syncing…' : state === 'error' ? 'error' : 'offline';
}

// Track the remote state vector we last received per list, so we can send diffs
const remoteStateVectors = {}; // { listId: Uint8Array }

function getWorkerUrl() {
  return window._customWorkerUrl || localStorage.getItem('liltask_worker_url') || WORKER_URL;
}

async function pushUpdate(listId) {
  const list = lists[listId];
  const workerUrl = getWorkerUrl();
  if (!list || !list.roomId || workerUrl.includes('YOUR_WORKER')) return;
  const doc = getOrCreateYDoc(listId);

  // Send only the diff the remote hasn't seen yet
  const remoteStateVec = remoteStateVectors[listId] || null;
  const update = remoteStateVec
    ? Y.encodeStateAsUpdate(doc, remoteStateVec)
    : Y.encodeStateAsUpdate(doc);

  // Nothing new to push
  if (update.length <= 2) return;

  try {
    setSyncStatus('syncing');
    // Prefix update with 4-byte big-endian length so worker can frame them
    const framed = new Uint8Array(4 + update.length);
    const view = new DataView(framed.buffer);
    view.setUint32(0, update.length, false);
    framed.set(update, 4);

    const r = await fetch(workerUrl + '/' + list.roomId, {
      method: 'POST',
      body: framed,
      headers: { 'Content-Type': 'application/octet-stream' }
    });
    if (r.ok) setSyncStatus('synced');
    else setSyncStatus('error');
  } catch(e) { setSyncStatus('error'); }
}

async function pullUpdate(listId) {
  const list = lists[listId];
  const workerUrl = getWorkerUrl();
  if (!list || !list.roomId || workerUrl.includes('YOUR_WORKER')) return;
  try {
    const r = await fetch(workerUrl + '/' + list.roomId);
    if (r.status === 204) return;
    if (r.ok) {
      const buf = await r.arrayBuffer();
      const doc = getOrCreateYDoc(listId);

      // Parse length-framed updates and apply each one
      const data = new Uint8Array(buf);
      const dv = new DataView(buf);
      let offset = 0;
      const updates = [];

      while (offset < data.byteLength) {
        if (offset + 4 > data.byteLength) break; // malformed
        const len = dv.getUint32(offset, false);
        offset += 4;
        if (offset + len > data.byteLength) break; // malformed
        updates.push(data.slice(offset, offset + len));
        offset += len;
      }

      if (updates.length > 0) {
        // Merge all into one and apply — idempotent for Yjs
        const merged = Y.mergeUpdates(updates);
        isPulling = true;
        Y.applyUpdate(doc, merged);
        isPulling = false;
        // Remember the remote state so we only push diffs next time
        remoteStateVectors[listId] = Y.encodeStateVector(doc);
      } else if (data.byteLength > 0) {
        // Legacy blob (no framing) — apply directly as fallback
        isPulling = true;
        Y.applyUpdate(doc, data);
        isPulling = false;
        remoteStateVectors[listId] = Y.encodeStateVector(doc);
      }

      setSyncStatus('synced');
    }
  } catch(e) { setSyncStatus('error'); }
}

let isPulling = false; // guard: don't push during/after pull

function scheduleSync(listId) {
  if (isPulling) return; // don't echo remote changes back
  clearTimeout(syncTimers[listId]);
  syncTimers[listId] = setTimeout(() => pushUpdate(listId), 800);
}

// ─── List Management ──────────────────────────────────────
function createList(name, roomId = null) {
  const id = generateId();
  roomId = roomId || generateId(16);
  lists[id] = { name: name || 'Untitled', roomId };
  save();
  getOrCreateYDoc(id); // init
  return id;
}

function ensureDefaultList() {
  if (Object.keys(lists).length === 0) {
    const id = createList('My List');
    activeListId = id;
    save();
  }
  if (!activeListId || !lists[activeListId]) {
    activeListId = Object.keys(lists)[0];
    save();
  }
}

function switchList(id) {
  activeListId = id;
  save();
  document.getElementById('header-title').textContent = lists[id]?.name || 'List';
  renderListsNav();
  renderTodos();
  updateProgress();
  pullUpdate(id);
  touchListTTL(id);
  if (window.innerWidth <= 640) closeSidebar();
}

function touchListTTL(listId) {
  // POST an empty-diff push just to reset the 60-day TTL on the worker
  // We send our full state so the worker resets expiry; push handles no-diff guard
  const list = lists[listId];
  const workerUrl = getWorkerUrl();
  if (!list || !list.roomId || workerUrl.includes('YOUR_WORKER')) return;
  const doc = getOrCreateYDoc(listId);
  const update = Y.encodeStateAsUpdate(doc);
  if (!update || update.length <= 2) return;
  const framed = new Uint8Array(4 + update.length);
  const view = new DataView(framed.buffer);
  view.setUint32(0, update.length, false);
  framed.set(update, 4);
  fetch(workerUrl + '/' + list.roomId, {
    method: 'POST',
    body: framed,
    headers: { 'Content-Type': 'application/octet-stream' }
  }).catch(() => {});
}

window.deleteList = function(listId) {
  if (Object.keys(lists).length <= 1) {
    openModal(`<div class="modal-title">Can't delete</div>
      <p style="color:var(--text3);font-size:14px;margin-bottom:16px">You need at least one list.</p>
      <div class="modal-actions"><button class="modal-btn primary" onclick="closeModal()">OK</button></div>`);
    return;
  }
  const listName = escHtml(lists[listId]?.name || 'this list');
  openModal(`<div class="modal-title">Delete list?</div>
    <p style="color:var(--text3);font-size:14px;margin-bottom:16px">Delete <strong style="color:var(--text)">${listName}</strong>? This removes it from your device only — collaborators keep their copy.</p>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn" style="background:var(--red);border-color:var(--red);color:#fff" onclick="confirmDeleteList('${listId}')">Delete</button>
    </div>`);
};

window.confirmDeleteList = function(listId) {
  delete lists[listId];
  localStorage.removeItem('liltask_ydoc_' + listId);
  delete ydocs[listId];
  if (activeListId === listId) {
    activeListId = Object.keys(lists)[0] || null;
  }
  save();
  closeModal();
  ensureDefaultList();
  renderListsNav();
  switchList(activeListId);
};

window.manualSync = async function() {
  const btn = document.getElementById('sync-btn');
  if (btn) btn.classList.add('spinning');
  await pullUpdate(activeListId);
  if (btn) {
    btn.classList.remove('spinning');
  }
};

// ─── Add / Toggle / Delete Todo ──────────────────────────
function addTodo() {
  const inp = document.getElementById('todo-input');
  const text = inp.value.trim();
  if (!text || !activeListId) return;
  const todos = getYTodos(activeListId);
  const doc = getOrCreateYDoc(activeListId);
  doc.transact(() => {
    todos.push([{ id: generateId(8), text, done: false, created: Date.now() }]);
  });
  inp.value = '';
  inp.focus();
}

document.getElementById('todo-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTodo();
});

function toggleTodo(listId, todoId) {
  const todos = getYTodos(listId);
  const arr = todos.toArray();
  const idx = arr.findIndex(t => t.id === todoId);
  if (idx === -1) return;
  const item = arr[idx];
  const doc = getOrCreateYDoc(listId);
  doc.transact(() => {
    todos.delete(idx, 1);
    todos.insert(idx, [{ ...item, done: !item.done }]);
  });
  checkFinishReward(listId);
}

function deleteTodo(listId, todoId) {
  const todos = getYTodos(listId);
  const arr = todos.toArray();
  const idx = arr.findIndex(t => t.id === todoId);
  if (idx === -1) return;
  const doc = getOrCreateYDoc(listId);
  doc.transact(() => { todos.delete(idx, 1); });
}

function editTodo(listId, todoId, newText) {
  const todos = getYTodos(listId);
  const arr = todos.toArray();
  const idx = arr.findIndex(t => t.id === todoId);
  if (idx === -1) return;
  const item = arr[idx];
  const doc = getOrCreateYDoc(listId);
  doc.transact(() => {
    todos.delete(idx, 1);
    todos.insert(idx, [{ ...item, text: newText }]);
  });
}

function reorderTodo(listId, fromIdx, toIdx) {
  const todos = getYTodos(listId);
  const arr = todos.toArray();
  const item = arr[fromIdx];
  const doc = getOrCreateYDoc(listId);
  doc.transact(() => {
    todos.delete(fromIdx, 1);
    const insertAt = fromIdx < toIdx ? toIdx : toIdx;
    todos.insert(insertAt, [item]);
  });
}

  '🍞 Bakery':     ['bread','bagel','muffin','cake','cookie','tortilla','bun','roll','pastry','croissant'],
  '🥫 Pantry':     ['pasta','rice','bean','beans','lentil','soup','can','canned','sauce','oil','vinegar','spice','flour','sugar','salt','cereal','oat','oats','jam','peanut'],
  '🧴 Household':  ['soap','shampoo','toothpaste','detergent','toilet','paper','towel','cleaner','bleach','trash','bag','bags','dishwasher'],

};

function categorize(text) {
  const lower = text.toLowerCase();
  for (const [cat, words] of Object.entries(CATEGORY_KEYWORDS)) {
    if (words.some(w => lower.includes(w))) return cat;
  }
  return '📋 Other';
}

// ─── Render Todos ─────────────────────────────────────────
function renderTodos() {
  if (!activeListId || currentView !== 'lists') return;
  const container = document.getElementById('todos-container');
  const todos = getYTodos(activeListId);
  const arr = todos.toArray();

  if (arr.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="es-icon">📝</div><div class="es-title">No tasks yet</div><div class="es-desc">Add your first task above</div></div>`;
    return;
  }

  const global = arr.map((item, idx) => ({ ...item, idx })).filter(t => !t.dueDate);
  const dated  = arr.map((item, idx) => ({ ...item, idx })).filter(t => !!t.dueDate);

  // Sort dated by dueDate ascending
  dated.sort((a, b) => a.dueDate.localeCompare(b.dueDate));

  let html = '';

  if (global.length > 0) {
    html += `<div class="section-header">📋 Global Todos <span class="sh-count">${global.length}</span></div>`;
    if (plugins.categoryGroup) {
      const groups = {};
      global.forEach(item => {
        const cat = categorize(item.text);
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(item);
      });
      for (const [cat, items] of Object.entries(groups)) {
        html += `<div class="category-header">${cat}</div>`;
        items.forEach(item => { html += todoHTML(item, item.idx); });
      }
    } else {
      global.forEach(item => { html += todoHTML(item, item.idx); });
    }
  }

  if (dated.length > 0) {
    html += `<div class="section-header">📅 Todos with Dues <span class="sh-count">${dated.length}</span></div>`;
    dated.forEach(item => { html += todoHTML(item, item.idx); });
  }

  container.innerHTML = html;
  attachTodoListeners();
  attachDragListeners();
}

function dueBadgeHTML(item) {
  if (!item.dueDate) return '';
  const [y,m,d] = item.dueDate.split('-').map(Number);
  const due = new Date(y, m-1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((due - today) / 86400000);
  let label, cls = '';
  if (diff < 0) { label = 'Overdue'; cls = 'overdue'; }
  else if (diff === 0) { label = 'Today'; }
  else if (diff === 1) { label = 'Tomorrow'; }
  else {
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    label = mo[m-1] + ' ' + d;
  }
  return `<span class="due-badge ${cls}">${label}</span>`;
}

function todoHTML(item, idx) {
  return `<div class="todo-item ${item.done ? 'done' : ''}" data-idx="${idx}" data-id="${item.id}" draggable="true">
    <div class="drag-handle" title="Drag to reorder">⣿</div>
    <button class="todo-check ${item.done ? 'checked' : ''}" data-id="${item.id}" onclick="toggleTodo('${activeListId}', '${item.id}')"></button>
    <div class="todo-text" contenteditable="true" data-idx="${idx}" data-id="${item.id}" spellcheck="true">${escHtml(item.text)}</div>
    ${dueBadgeHTML(item)}
    <div class="todo-actions">
      <button class="todo-act-btn" onclick="deleteTodo('${activeListId}', '${item.id}')" title="Delete">✕</button>
    </div>
  </div>`;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function attachTodoListeners() {
  document.querySelectorAll('.todo-text').forEach(el => {
    el.addEventListener('blur', () => {
      const todoId = el.dataset.id;
      const newText = el.textContent.trim();
      if (newText) editTodo(activeListId, todoId, newText);
      else renderTodos();
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  });
}

function attachDragListeners() {
  let dragIdx = null;
  let overIdx = null;

  document.querySelectorAll('#todos-container .todo-item').forEach(el => {
    const handle = el.querySelector('.drag-handle');

    // Desktop drag via handle
    handle.addEventListener('mousedown', () => { el.draggable = true; });
    el.addEventListener('dragstart', e => {
      dragIdx = parseInt(el.dataset.idx);
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.todo-item').forEach(i => i.classList.remove('drag-over'));
      if (dragIdx !== null && overIdx !== null && dragIdx !== overIdx) {
        reorderTodo(activeListId, dragIdx, overIdx);
      }
      dragIdx = null; overIdx = null;
      el.draggable = false;
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      document.querySelectorAll('.todo-item').forEach(i => i.classList.remove('drag-over'));
      overIdx = parseInt(el.dataset.idx);
      if (overIdx !== dragIdx) el.classList.add('drag-over');
    });

    // Touch drag
    let touchStartY = 0, touchDragIdx = null;
    handle.addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
      touchDragIdx = parseInt(el.dataset.idx);
      el.classList.add('dragging');
    }, { passive: true });
    handle.addEventListener('touchmove', e => {
      e.preventDefault();
      const y = e.touches[0].clientY;
      const els = [...document.querySelectorAll('#todos-container .todo-item')];
      document.querySelectorAll('.todo-item').forEach(i => i.classList.remove('drag-over'));
      const target = els.find(item => {
        const r = item.getBoundingClientRect();
        return y >= r.top && y <= r.bottom;
      });
      if (target) {
        overIdx = parseInt(target.dataset.idx);
        if (overIdx !== touchDragIdx) target.classList.add('drag-over');
      }
    }, { passive: false });
    handle.addEventListener('touchend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.todo-item').forEach(i => i.classList.remove('drag-over'));
      if (touchDragIdx !== null && overIdx !== null && touchDragIdx !== overIdx) {
        reorderTodo(activeListId, touchDragIdx, overIdx);
      }
      touchDragIdx = null; overIdx = null;
    });
  });
}

function updateProgress() {
  if (!activeListId) return;

// ─── Calendar ─────────────────────────────────────────────
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function renderCalendar() {
  document.getElementById('cal-title').textContent = `${MONTH_NAMES[calMonth]} ${calYear}`;

  const header = document.getElementById('cal-header');
  header.innerHTML = DAY_NAMES.map(d => `<div class="cal-day-name">${d}</div>`).join('');

  const grid = document.getElementById('cal-grid');
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  const today = new Date();

  let cells = '';

  // Prev month overflow
  for (let i = firstDay - 1; i >= 0; i--) {
    const d = daysInPrev - i;
    cells += calCell(calYear, calMonth - 1, d, true, today);
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    cells += calCell(calYear, calMonth, d, false, today);
  }
  // Next month overflow
  const total = firstDay + daysInMonth;
  const nextCells = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= nextCells; d++) {
    cells += calCell(calYear, calMonth + 1, d, true, today);
  }

  grid.innerHTML = cells;
}

function calCell(year, month, day, otherMonth, today) {
  const realMonth = ((month % 12) + 12) % 12;
  const realYear = year + Math.floor(month / 12);
  const dateKey = `${realYear}-${String(realMonth + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const isToday = today.getFullYear() === realYear && today.getMonth() === realMonth && today.getDate() === day;

  // Collect all cal todos for this date across all lists
  const allTodos = getCalTodosForDate(dateKey);
  const hasTodos = allTodos.length > 0;

  const previews = allTodos.slice(0, 2).map(t =>
    `<div class="cal-todo-preview ${t.done ? 'done-prev' : ''}">${escHtml(t.text.substring(0, 18))}${t.text.length > 18 ? '…' : ''}</div>`
  ).join('');

  const dots = allTodos.slice(0, 7).map(t =>
    `<div class="cal-dot ${t.done ? 'done-dot' : ''}"></div>`
  ).join('');
  const dotsHTML = hasTodos ? `<div class="cal-dots">${dots}</div>` : '';

  return `<div class="cal-cell ${otherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${hasTodos ? 'has-todos' : ''}"
    onclick="openCalDateModal('${dateKey}')">
    <div class="cal-date">${day}</div>
    ${previews}
    ${dotsHTML}
  </div>`;
}

function getCalTodosForDate(dateKey) {
  const result = [];
  for (const listId of Object.keys(lists)) {
    getYTodos(listId).toArray()
      .filter(t => t.dueDate === dateKey)
      .forEach(t => result.push({ ...t, listName: lists[listId]?.name }));
  }
  return result;
}

window.calNav = function(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
};

window.calAddTodo = function(dateKey) {
  const inp = document.getElementById('cal-todo-inp');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  const doc = getOrCreateYDoc(activeListId);
  const newId = generateId(8);
  // Single write: Y.Array only — dueDate field drives everything
  doc.transact(() => {
    getYTodos(activeListId).push([{ id: newId, text, done: false, dueDate: dateKey, calEntry: true, created: Date.now() }]);
  });
  inp.value = '';
  inp.focus();
  // Patch modal DOM in-place (no re-open flash)
  const listEl = document.getElementById('cal-date-todos');
  if (listEl) {
    const placeholder = listEl.querySelector('p');
    if (placeholder) placeholder.remove();
    const row = document.createElement('div');
    row.className = 'cal-modal-todo';
    row.dataset.id = newId;
    row.style.cssText = 'opacity:0;transform:translateY(-4px);transition:opacity 0.18s ease,transform 0.18s ease';
    row.innerHTML = `
      <button class="todo-check" onclick="calToggleTodo('${dateKey}', '${newId}')"></button>
      <span style="flex:1">${escHtml(text)}</span>
      <button class="todo-act-btn" onclick="calDeleteTodo('${dateKey}', '${newId}')">✕</button>`;
    listEl.appendChild(row);
    requestAnimationFrame(() => { row.style.opacity = '1'; row.style.transform = 'translateY(0)'; });
  }
};

window.calToggleTodo = function(dateKey, todoId) {
  // Single source: find by id in Y.Array
  const todos = getYTodos(activeListId);
  const arr = todos.toArray();
  const idx = arr.findIndex(t => t.id === todoId);
  if (idx === -1) return;
  const item = arr[idx];
  const newDone = !item.done;
  const doc = getOrCreateYDoc(activeListId);
  doc.transact(() => {
    todos.delete(idx, 1);
    todos.insert(idx, [{ ...item, done: newDone }]);
  });
  // Patch modal DOM in-place
  const row = document.querySelector(`#cal-date-todos .cal-modal-todo[data-id="${todoId}"]`);
  if (row) {
    const btn = row.querySelector('.todo-check');
    const span = row.querySelector('span');
    if (btn) btn.classList.toggle('checked', newDone);
    if (span) span.style.cssText = newDone ? 'flex:1;text-decoration:line-through;color:var(--text3)' : 'flex:1';
  }
  // List view auto-updates via Yjs update event → renderTodos()
};

window.calDeleteTodo = function(dateKey, todoId) {
  // Single source: find by id in Y.Array and delete
  const todos = getYTodos(activeListId);
  const arr = todos.toArray();
  const idx = arr.findIndex(t => t.id === todoId);
  if (idx === -1) return;
  const doc = getOrCreateYDoc(activeListId);
  doc.transact(() => { todos.delete(idx, 1); });
  // Animate row out of modal
  const row = document.querySelector(`#cal-date-todos .cal-modal-todo[data-id="${todoId}"]`);
  if (row) {
    row.style.cssText += ';transition:opacity 0.15s ease,transform 0.15s ease;opacity:0;transform:translateX(8px)';
    setTimeout(() => {
      row.remove();
      const listEl = document.getElementById('cal-date-todos');
      if (listEl && listEl.querySelectorAll('.cal-modal-todo').length === 0) {
        listEl.innerHTML = `<p style="color:var(--text3);font-size:13px;padding:8px 0">No tasks for this day yet.</p>`;
      }
    }, 160);
  }
  // List view auto-updates via Yjs update event → renderTodos()
};

  document.getElementById('sidebar-backdrop').classList.add('active');
};
window.closeSidebar = function() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('active');
};

// ─── URL-based room joining ───────────────────────────────
function handleRoomFromURL() {
  const parsed = getRoomFromURL();
  if (!parsed) return false;
  const { roomId, name } = parsed;

  // Already have this room — just switch to it
  const existing = Object.entries(lists).find(([, l]) => l.roomId === roomId);
  if (existing) {
    switchList(existing[0]);
    return true;
  }

  // New room — create list with the shared name
  const id = generateId();
  lists[id] = { name, roomId };
  save();
  getOrCreateYDoc(id);
  activeListId = id;
  save();
  pullUpdate(id);
  return true;
}

// ─── Themes Modal ─────────────────────────────────────────

  { id:'dark-violet',  label:'Violet Night',  dark:true,  swatch:['#0f0f11','#7c6aff','#a855f7'] },
  { id:'dark-slate',   label:'GitHub Dark',   dark:true,  swatch:['#0d1117','#58a6ff','#79c0ff'] },
  { id:'dark-rose',    label:'Rose Dark',     dark:true,  swatch:['#100c10','#e05c9a','#f07ac0'] },
  { id:'dark-forest',  label:'Forest Dark',   dark:true,  swatch:['#0a0f0c','#4ade80','#86efac'] },
  { id:'light-clean',  label:'Clean Light',   dark:false, swatch:['#f8f8fc','#6655ee','#9933ff'] },
  { id:'light-warm',   label:'Warm Parchment',dark:false, swatch:['#fdf8f0','#c05a10','#e07030'] },
  { id:'light-sky',    label:'Sky Blue',      dark:false, swatch:['#f0f6ff','#1a72e8','#4090ff'] },

let activeTheme = localStorage.getItem('liltask_theme') || 'dark-violet';

function applyTheme(id) {
  activeTheme = id;
  document.documentElement.setAttribute('data-theme', id);
  localStorage.setItem('liltask_theme', id);
}

applyTheme(activeTheme);

    const active = t.id === activeTheme;
    const [bg, a1, a2] = t.swatch;
    return `<div class="theme-card ${active ? 'theme-active' : ''}" onclick="pickTheme('${t.id}')" id="tcard-${t.id}" style="cursor:pointer">
      <div class="theme-preview" style="background:${bg};border-radius:8px;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;border:1.5px solid ${active ? a1 : 'rgba(128,128,128,0.2)'}">
        <div style="width:14px;height:14px;border-radius:50%;background:${a1}"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:${a2}"></div>
        <div style="width:8px;height:8px;border-radius:50%;background:${bg === '#f8f8fc' || bg === '#fdf8f0' || bg === '#f0f6ff' ? '#aaa' : '#fff'}; opacity:0.4"></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:13px;font-weight:600;color:var(--text)">${t.label}</span>
        <span style="font-size:10px;font-family:var(--mono);color:var(--text3);margin-left:auto">${t.dark ? '🌙' : '☀️'}</span>
        ${active ? '<span style="font-size:10px;font-family:var(--mono);color:var(--accent);margin-left:4px">✓ active</span>' : ''}
      </div>
    </div>`;
  }).join('');

  openModal(`<div class="modal-title">🎨 Themes</div>
    <p style="color:var(--text3);font-size:13px;margin-bottom:16px">Choose a look. Changes apply instantly.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px">
      <div style="grid-column:1/-1;font-size:10px;font-family:var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin-bottom:2px">🌙 Dark</div>
      ${THEMES.filter(t=>t.dark).map(t => {
        const active = t.id === activeTheme;
        const [bg,a1,a2] = t.swatch;
        return `<div onclick="pickTheme('${t.id}')" id="tcard-${t.id}" style="cursor:pointer;padding:10px;border-radius:var(--radius);border:1.5px solid ${active ? 'var(--accent)' : 'var(--border)'};background:${active ? 'var(--accent-glow)' : 'var(--bg3)'};transition:all 0.15s">
          <div style="background:${bg};border-radius:6px;height:38px;display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:7px">
            <div style="width:12px;height:12px;border-radius:50%;background:${a1}"></div>
            <div style="width:9px;height:9px;border-radius:50%;background:${a2}"></div>
          </div>
          <div style="font-size:12px;font-weight:600;color:var(--text)">${t.label}</div>
          ${active ? '<div style="font-size:10px;font-family:var(--mono);color:var(--accent)">✓ active</div>' : ''}
        </div>`;
      }).join('')}
      <div style="grid-column:1/-1;font-size:10px;font-family:var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin:6px 0 2px">☀️ Light</div>
      ${THEMES.filter(t=>!t.dark).map(t => {
        const active = t.id === activeTheme;
        const [bg,a1,a2] = t.swatch;
        return `<div onclick="pickTheme('${t.id}')" id="tcard-${t.id}" style="cursor:pointer;padding:10px;border-radius:var(--radius);border:1.5px solid ${active ? 'var(--accent)' : 'var(--border)'};background:${active ? 'var(--accent-glow)' : 'var(--bg3)'};transition:all 0.15s">
          <div style="background:${bg};border-radius:6px;height:38px;display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:7px;border:1px solid rgba(0,0,0,0.08)">
            <div style="width:12px;height:12px;border-radius:50%;background:${a1}"></div>
            <div style="width:9px;height:9px;border-radius:50%;background:${a2}"></div>
          </div>
          <div style="font-size:12px;font-weight:600;color:var(--text)">${t.label}</div>
          ${active ? '<div style="font-size:10px;font-family:var(--mono);color:var(--accent)">✓ active</div>' : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="modal-actions"><button class="modal-btn primary" onclick="closeModal()">Done</button></div>`);
};

window.pickTheme = function(id) {
  applyTheme(id);
  openThemesModal(); // re-render to show active state
};

// ─── Settings Modal ───────────────────────────────────────
window.openSettingsModal = function() {
  const currentUrl = localStorage.getItem('liltask_worker_url') || WORKER_URL;
  openModal(`<div class="modal-title">⚙️ Settings</div>
    <div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;letter-spacing:0.5px;color:var(--text2);margin-bottom:6px;font-family:var(--mono)">CLOUDFLARE WORKER URL</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px;line-height:1.5">Set your own deployed worker for sync. Leave the default to run offline-only.</div>
      <div style="background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--text3);word-break:break-all;margin-bottom:10px">${escHtml(currentUrl)}</div>
      <input class="modal-input" id="worker-url-inp" placeholder="https://your-worker.workers.dev" value="${currentUrl.includes('YOUR_WORKER') ? '' : escHtml(currentUrl)}" autocomplete="off" style="margin-bottom:0"/>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="resetWorkerUrl()">Reset Default</button>
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="saveWorkerUrl()">Save</button>
    </div>`);
  setTimeout(() => document.getElementById('worker-url-inp')?.focus(), 50);
};

window.saveWorkerUrl = function() {
  const inp = document.getElementById('worker-url-inp');
  if (!inp) return;
  const val = inp.value.trim();
  if (val) {
    localStorage.setItem('liltask_worker_url', val);
    // Patch WORKER_URL at runtime
    window._customWorkerUrl = val;
  }
  closeModal();
  setSyncStatus(val && !val.includes('YOUR_WORKER') ? 'synced' : 'offline');
};

window.resetWorkerUrl = function() {
  localStorage.removeItem('liltask_worker_url');
  window._customWorkerUrl = null;
  closeModal();
  setSyncStatus('offline');
};


// ─── Init (deferred until Yjs ESM ready) ─────────────────
function appInit() {
  load();
  handleRoomFromURL();
  ensureDefaultList();
  renderListsNav();
  switchList(activeListId);
  const effectiveUrl = window._customWorkerUrl || localStorage.getItem('liltask_worker_url') || WORKER_URL;
  setSyncStatus(effectiveUrl.includes('YOUR_WORKER') ? 'offline' : 'synced');

  setInterval(() => {
    if (activeListId && lists[activeListId]?.roomId) pullUpdate(activeListId);
  }, 10000);

  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'liltask-v1';
      self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/']))));
      self.addEventListener('fetch', e => e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(res => {
          const clone = res.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
          return res;
        }).catch(() => caches.match('/')))
      ));
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }
}

// Yjs loads as ESM module → fires 'yjs-ready' once window.Y is set.
if (window.Y) {
  appInit();
} else {
  window.addEventListener('yjs-ready', appInit, { once: true });
  // Safety fallback if ESM blocked (e.g. strict CSP / offline)
  setTimeout(() => { if (!window._yjsReady) { console.warn('Yjs timeout — running without CRDT'); appInit(); } }, 4000);
}
</script>
